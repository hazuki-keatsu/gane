[workspace]
resolver = "2"
members = ["crates/*", "tests/unicode-diff/rust/"]

[workspace.package]
version = "0.1.0-alpha"
authors = ["Hazuki Keatsu"]
license = "Apache-2.0"

[workspace.dependencies]
unicode-general-category = "1.1.0"
regex = "1"
inkwell = { version = "0.9.0", features = ["llvm22-1"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
