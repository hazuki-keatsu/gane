name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15
            platform: macos
          - os: windows-2022
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22 on Linux
        if: matrix.platform == 'linux'
        run: |
          wget -qO "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          chmod +x "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 22
          sudo apt-get install -y llvm-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: Install LLVM 22 on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install llvm@22
          llvm_prefix="$(brew --prefix llvm@22)"
          echo "LLVM_SYS_221_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          "$llvm_prefix/bin/llvm-config" --version

      - name: Install LLVM 22 on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install llvm --version=22.1.8 --no-progress --yes
          $llvmPrefix = 'C:\Program Files\LLVM'
          "LLVM_SYS_221_PREFIX=$llvmPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$llvmPrefix\bin\llvm-config.exe" --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
